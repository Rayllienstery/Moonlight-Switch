name: All Builds

on:
  push:
    branches: [ master ]
    tags: [ 'v[0-9]*.[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:

jobs:
  switch:
    name: Switch
    uses: ./.github/workflows/switch.yml

  psvita:
    name: PS Vita
    uses: ./.github/workflows/psvita.yml

  android:
    name: Android
    uses: ./.github/workflows/android-apk.yml
    secrets: inherit

  apple:
    name: Apple
    uses: ./.github/workflows/apple.yml

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  linux:
    name: Linux
    uses: ./.github/workflows/linux.yml

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [switch, psvita, android, apple, windows, linux]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
